<!DOCTYPE html>
<html lang="ja">
<head>
  <title>Example Website</title>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    /* ヘッダー */
    header {
      background: #006400;
      color: white;
      padding: 0 32px;
      height: 64px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    header .logo {
      font-size: 1.5em;
      font-weight: 900;
      letter-spacing: 2px;
      border: 3px solid white;
      padding: 2px 10px;
      border-radius: 2px;
    }

    header .tagline {
      font-size: 0.75em;
      opacity: 0.85;
      letter-spacing: 1px;
    }

    /* ナビバー */
    nav {
      background: #004d00;
      display: flex;
      gap: 0;
      overflow-x: auto;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 0.82em;
      padding: 10px 20px;
      border-right: 1px solid rgba(255,255,255,0.15);
      white-space: nowrap;
      transition: background 0.15s;
    }

    nav a:hover { background: #006400; }

    /* メインコンテンツ */
    main {
      max-width: 860px;
      margin: 32px auto;
      padding: 0 16px;
    }

    /* セクション */
    .section {
      background: white;
      border-top: 4px solid #006400;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      padding: 24px 28px;
      margin-bottom: 24px;
    }

    .section h2 {
      font-size: 1em;
      color: #006400;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e0e0e0;
      letter-spacing: 1px;
    }

    /* サイト一覧 */
    .site-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .site-list li a {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #222;
      padding: 12px 16px;
      background: #f9f9f9;
      border-left: 4px solid #006400;
      transition: background 0.15s;
      font-size: 0.95em;
    }

    .site-list li a:hover { background: #e8f5e8; }

    .site-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      background: #006400;
      color: white;
      border-radius: 50%;
      font-weight: bold;
      font-size: 0.85em;
      flex-shrink: 0;
    }

    /* 数当てゲーム */
    .guess-desc {
      font-size: 0.88em;
      color: #555;
      margin-bottom: 16px;
      line-height: 1.8;
    }

    #guessGame {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    #guessGame label {
      font-size: 0.88em;
      color: #444;
    }

    #guessField {
      width: 80px;
      padding: 6px 10px;
      border: 1px solid #bbb;
      font-size: 0.95em;
    }

    #guessSubmit, #guessReset {
      padding: 7px 16px;
      border: none;
      cursor: pointer;
      font-size: 0.85em;
      font-weight: bold;
      border-radius: 2px;
    }

    #guessSubmit {
      background: #006400;
      color: white;
    }

    #guessSubmit:hover { background: #004d00; }

    #guessReset {
      background: #e0e0e0;
      color: #444;
    }

    #guessReset:hover { background: #ccc; }

    #guessResult {
      margin-top: 12px;
      font-size: 0.9em;
      font-weight: bold;
      color: #006400;
    }

    /* フッター */
    footer {
      background: #006400;
      color: rgba(255,255,255,0.7);
      text-align: center;
      padding: 16px;
      font-size: 0.75em;
      margin-top: 48px;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">JE</div>
  <div class="tagline">Example Website — Moving forward with you</div>
</header>

<nav>
  <a href="index.html">トップ</a>
  <a href="pokemon.html">ポケモンガチャ</a>
  <a href="castles.html">日本の名城</a>
  <a href="visited.html">訪問マップ</a>
</nav>

<main>
  <div class="section">
    <h2>サイト一覧</h2>
    <ul class="site-list">
      <li><a href="pokemon.html"><span class="site-num">1</span>ポケモンガチャ</a></li>
      <li><a href="castles.html"><span class="site-num">2</span>日本の名城</a></li>
      <li><a href="visited.html"><span class="site-num">3</span>訪問マップ</a></li>
    </ul>
  </div>

  <div class="section">
    <h2>数当てゲームでサイトを開こう！</h2>
    <p class="guess-desc">1〜3の数字を当てると、その番号のサイトに移動します。</p>
    <div id="guessGame">
      <label for="guessField">予想:</label>
      <input type="number" min="1" max="3" id="guessField">
      <input type="submit" value="予想を入力" id="guessSubmit">
      <input type="button" value="リセット" id="guessReset">
    </div>
    <p id="guessResult"></p>
  </div>
</main>

<footer>
  &copy; 2026 Example Website
</footer>

<script>
  const sites = {
    1: 'pokemon.html',
    2: 'castles.html',
    3: 'visited.html'
  };

  let answerNumber = Math.floor(Math.random() * 3) + 1;

  let guessField = document.querySelector('#guessField');
  let guessResult = document.querySelector('#guessResult');

  document.querySelector('#guessSubmit').addEventListener('click', function() {
    let userGuess = Number(guessField.value);
    if (userGuess === answerNumber) {
      guessResult.textContent = '正解！' + answerNumber + '番のサイトに移動します...';
      setTimeout(function() {
        window.location.href = sites[answerNumber];
      }, 1200);
    } else if (userGuess < answerNumber) {
      guessResult.textContent = 'もっと大きいです';
    } else {
      guessResult.textContent = 'もっと小さいです';
    }
  });

  document.querySelector('#guessReset').addEventListener('click', function() {
    answerNumber = Math.floor(Math.random() * 3) + 1;
    guessField.value = '';
    guessResult.textContent = '';
  });
</script>

</body>
</html>
