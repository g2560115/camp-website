<!DOCTYPE html>

  <title>日本の名城</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@700&display=swap" rel="stylesheet">
  <style>
    main {
      padding-top: 120px;
      position: relative;
      z-index: 1;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      font-family: 'Kaisei Decol', serif;
      font-weight: 700;
      font-size: 3em;
      letter-spacing: 0.15em;
      color: #2a1a00;
      text-shadow: 3px 3px 0 #8B4513, 5px 5px 8px rgba(0,0,0,0.4);
    }

    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 32px;
    }

    #castle-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .castle-card {
      border: 1px solid #ddd;
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      position: relative;
      z-index: 1;
    }

    .castle-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .castle-card .card-body {
      padding: 16px;
    }

    .castle-card h2 {
      font-size: 1.1em;
      margin: 0 0 4px;
    }

    .castle-card .meta {
      font-size: 0.82em;
      color: #888;
      margin-bottom: 8px;
    }

    .castle-card .description {
      font-size: 0.92em;
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .castle-card a.map-link {
      font-size: 0.85em;
      text-decoration: none;
      color: #1E88E5;
    }

    .castle-card a.map-link:hover {
      text-decoration: underline;
    }

    #top-border, #bottom-border {
      width: 100%;
      height: 48px;
      background:
        repeating-linear-gradient(
          90deg,
          #8B4513 0px, #8B4513 20px,
          #c8860a 20px, #c8860a 40px,
          #8B4513 40px, #8B4513 60px,
          #5a2d0c 60px, #5a2d0c 80px
        );
      position: relative;
      z-index: 2;
    }

    #top-border {
      border-bottom: 4px solid #3a1a00;
    }

    #bottom-border {
      border-top: 4px solid #3a1a00;
    }

    #top-border::before, #bottom-border::before {
      content: '❖ ✦ ❖ ✦ ❖ ✦ ❖ ✦ ❖ ✦ ❖ ✦ ❖ ✦ ❖ ✦ ❖ ✦ ❖ ✦ ❖ ✦ ❖ ✦ ❖ ✦ ❖ ✦ ❖';
      position: absolute;
      top: 50%; left: 0; right: 0;
      transform: translateY(-50%);
      text-align: center;
      font-size: 12px;
      color: rgba(255,220,100,0.7);
      letter-spacing: 4px;
      overflow: hidden;
      white-space: nowrap;
    }

    #shuriken-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .shuriken {
      position: absolute;
      top: -60px;
      animation: fall linear infinite;
    }

    @keyframes fall {
      to { transform: translateY(110vh) rotate(720deg); }
    }
  </style>
</head>
<body>

<div id="top-border"></div>
<div id="shuriken-container"></div>

<main class="container">
  <h1>日本の名城</h1>
  <p class="subtitle">歴史と美しさで知られる日本各地の城を紹介します</p>

  <div id="castle-grid"></div>
</main>
<div id="bottom-border"></div>

<script>
  const shurikenContainer = document.getElementById('shuriken-container');
  for (let i = 0; i < 15; i++) {
    let img = document.createElement('img');
    img.src = 'shurikenn.jpeg';
    img.className = 'shuriken';
    img.style.left = Math.random() * 100 + 'vw';
    img.style.animationDuration = (4 + Math.random() * 6) + 's';
    img.style.animationDelay = (Math.random() * 8) + 's';
    let size = (30 + Math.random() * 40) + 'px';
    img.style.width = size;
    img.style.height = size;
    shurikenContainer.appendChild(img);
  }

  const castles = [
    {
      name: '姫路城',
      location: '兵庫県姫路市',
      built: '1346年（現存天守は1601年）',
      description: '白鷺城とも呼ばれる純白の天守が美しい、国宝・世界遺産の名城。',
      image: 'Himeji.jpg',
      mapUrl: 'https://maps.google.com/?q=姫路城'
    },
    {
      name: '松本城',
      location: '長野県松本市',
      built: '1593年頃',
      description: '黒と白のコントラストが印象的な天守を持つ国宝城郭。日本最古の五重天守のひとつ。',
      image: 'Matsumoto.jpeg',
      mapUrl: 'https://maps.google.com/?q=松本城'
    },
    {
      name: '熊本城',
      location: '熊本県熊本市',
      built: '1607年',
      description: '難攻不落の城として知られ、その堅固な石垣は「武者返し」と呼ばれる。2016年の地震から復旧中。',
      image: 'Kumamoto.jpg',
      mapUrl: 'https://maps.google.com/?q=熊本城'
    },
    {
      name: '大阪城',
      location: '大阪府大阪市',
      built: '1583年（豊臣秀吉）',
      description: '豊臣秀吉が築いた天下の名城。現在の天守は1931年に再建され、大阪のシンボルとなっている。',
      image: 'Osaka.jpeg',
      mapUrl: 'https://maps.google.com/?q=大阪城'
    },
    {
      name: '彦根城',
      location: '滋賀県彦根市',
      built: '1622年',
      description: '琵琶湖を望む丘に建つ国宝天守。現存12天守のひとつで、繊細な意匠が特徴。',
      image: 'HIkone.jpeg',
      mapUrl: 'https://maps.google.com/?q=彦根城'
    },
    {
      name: '松江城',
      location: '島根県松江市',
      built: '1611年',
      description: '山陰地方唯一の現存天守で国宝。宍道湖近くに構え、黒い板張りの外観が重厚な印象を与える。',
      image: 'Matsue.jpeg',
      mapUrl: 'https://maps.google.com/?q=松江城'
    },
  ];

  const grid = document.getElementById('castle-grid');

  castles.forEach(function(castle) {
    let card = document.createElement('div');
    card.className = 'castle-card';
    card.innerHTML = `
      <img src="${castle.image}" alt="${castle.name}">
      <div class="card-body">
        <h2>${castle.name}</h2>
        <div class="meta">📍 ${castle.location}　🏯 築城: ${castle.built}</div>
        <p class="description">${castle.description}</p>
        <a class="map-link" href="${castle.mapUrl}" target="_blank">🗺️ 地図で見る</a>
      </div>
    `;
    grid.appendChild(card);
  });
</script>

</body>
</html>
