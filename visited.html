<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>訪問マップ</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson@3"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
      background: #fff;
      color: #222;
      min-height: 100vh;
    }

    header {
      background: #f5f5f5;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #ddd;
      flex-wrap: wrap;
      gap: 8px;
    }

    header h1 { font-size: 2.2em; font-weight: 900; letter-spacing: 2px; color: #222; }

    #counter {
      font-size: 0.82em;
      color: #555;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .count-lived   span { color: #e03060; font-weight: bold; font-size: 1.1em; }
    .count-stayed  span { color: #0099bb; font-weight: bold; font-size: 1.1em; }
    .count-visited span { color: #448800; font-weight: bold; font-size: 1.1em; }
    #c-total { color: #222; font-weight: bold; font-size: 1.1em; }

    #legend {
      display: flex;
      gap: 8px;
      padding: 8px 24px;
      background: #f9f9f9;
      flex-wrap: wrap;
      align-items: center;
      font-size: 0.8em;
      border-bottom: 1px solid #ddd;
    }

    #legend span { color: #888; }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 999px;
    }

    .legend-color {
      width: 14px; height: 14px;
      border-radius: 3px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    /* パンくず */
    #breadcrumb {
      padding: 8px 24px;
      background: #f0f0f0;
      font-size: 0.82em;
      color: #666;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
    }

    #back-btn {
      background: #e0e0e0;
      color: #444;
      border: 1px solid #bbb;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85em;
      display: none;
    }

    #back-btn:hover { background: #006400; color: white; border-color: #006400; }

    #loading {
      display: none;
      color: #888;
      font-size: 0.85em;
    }

    #hint {
      text-align: center;
      font-size: 0.75em;
      color: #999;
      padding: 4px;
      background: #f9f9f9;
      border-bottom: 1px solid #eee;
    }

    #map-container {
      display: flex;
      justify-content: center;
      padding: 8px;
      overflow: hidden;
    }

    svg { max-width: 100%; }

    .prefecture, .city {
      stroke: #aaa;
      stroke-width: 0.5;
      cursor: pointer;
      transition: filter 0.1s;
    }

    .prefecture:hover, .city:hover {
      filter: brightness(0.85);
      stroke: #333;
      stroke-width: 1;
    }

    .prefecture.selected, .city.selected {
      stroke: #333;
      stroke-width: 2;
      filter: brightness(0.9);
    }

    #tooltip {
      position: fixed;
      background: rgba(0,0,0,0.88);
      color: white;
      padding: 7px 12px;
      border-radius: 5px;
      font-size: 0.82em;
      pointer-events: none;
      display: none;
      z-index: 200;
      white-space: nowrap;
      border: 1px solid #334;
    }

    /* パネル */
    #panel {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      padding: 20px 24px;
      z-index: 300;
      min-width: 260px;
      max-width: 320px;
      display: none;
    }

    #panel.visible { display: block; }

    #panel-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 299;
      display: none;
    }

    #panel-overlay.visible { display: block; }

    #panel-title {
      font-size: 1.1em;
      font-weight: bold;
      color: #222;
      margin-bottom: 16px;
      padding-right: 24px;
    }

    #panel-close {
      position: absolute;
      top: 12px;
      right: 14px;
      background: none;
      border: none;
      color: #aaa;
      font-size: 1.3em;
      cursor: pointer;
      line-height: 1;
    }

    #panel-close:hover { color: #333; }

    .panel-section {
      margin-bottom: 16px;
    }

    .panel-label {
      font-size: 0.72em;
      color: #999;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    /* レベルボタン */
    #panel-levels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .level-btn {
      padding: 8px 6px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.78em;
      font-family: inherit;
      background: #f5f5f5;
      color: #666;
      transition: all 0.12s;
      text-align: center;
    }

    .level-btn:hover { border-color: #aaa; color: #222; }

    .level-btn.active-none    { background: #eee; color: #666; border-color: #bbb; }
    .level-btn.active-visited { background: #eaffd0; color: #3a7000; border-color: #88dd44; }
    .level-btn.active-stayed  { background: #d0f0ff; color: #006688; border-color: #50c8e8; }
    .level-btn.active-lived   { background: #ffe0e8; color: #b00030; border-color: #f06080; }

    /* カウント */
    #panel-count-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .count-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid #ccc;
      background: #f0f0f0;
      color: #333;
      font-size: 1.3em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s;
    }

    .count-btn:hover { background: #ddd; }
    .count-btn:disabled { opacity: 0.3; cursor: default; }

    #panel-count-val {
      font-size: 1.4em;
      font-weight: bold;
      color: #222;
      min-width: 32px;
      text-align: center;
    }

    #panel-count-label {
      font-size: 0.75em;
      color: #999;
    }

    /* また行きたいボタン */
    #panel-return-btn {
      width: 100%;
      padding: 9px;
      border-radius: 6px;
      border: 2px solid #ddd;
      background: #f9f9f9;
      color: #888;
      cursor: pointer;
      font-size: 0.82em;
      font-family: inherit;
      transition: all 0.12s;
    }

    #panel-return-btn.active {
      background: #fffbe0;
      border-color: #e8c000;
      color: #806000;
    }

    #panel-return-btn:hover { border-color: #e8c000; color: #806000; }

    /* 市区町村ボタン */
    #panel-drill-btn {
      width: 100%;
      padding: 9px;
      border-radius: 6px;
      border: 1px solid #bbb;
      background: #f0f0f0;
      color: #444;
      cursor: pointer;
      font-size: 0.82em;
      font-family: inherit;
      transition: background 0.12s;
      display: none;
    }

    #panel-drill-btn:hover { background: #006400; color: white; border-color: #006400; }

    #reset-btn {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background: #f0f0f0;
      color: #888;
      border: 1px solid #ccc;
      padding: 7px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.78em;
      transition: background 0.15s;
      z-index: 100;
    }

    #reset-btn:hover { background: #e05c5c; color: white; border-color: #e05c5c; }

    /* キラキラ */
    .sparkle {
      font-size: 12px;
      pointer-events: none;
      animation: twinkle ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(0.5); }
      50%       { opacity: 1; transform: scale(1.2); }
    }

    .count-return span { color: #f0d060; font-weight: bold; font-size: 1.1em; }
  </style>
</head>
<body>

<header>
  <h1>🗾 訪問マップ</h1>
  <div id="counter">
    <div class="count-item count-lived">住んだ: <span id="c-lived">0</span></div>
    <div class="count-item count-stayed">泊まった: <span id="c-stayed">0</span></div>
    <div class="count-item count-visited">訪れた: <span id="c-visited">0</span></div>
    <div class="count-item count-return">また行きたい: <span id="c-return">0</span></div>
    <div class="count-item">合計: <span id="c-total">0</span></div>
  </div>
</header>

<div id="legend">
  <span>凡例:</span>
  <div class="legend-item"><div class="legend-color" style="background:#2a2a4a"></div>未訪問</div>
  <div class="legend-item"><div class="legend-color" style="background:#88dd44"></div>訪れた</div>
  <div class="legend-item"><div class="legend-color" style="background:#50c8e8"></div>泊まった</div>
  <div class="legend-item"><div class="legend-color" style="background:#f06080"></div>住んだ</div>
  <div class="legend-item"><div class="legend-color" style="background:#f0d060; border:1px solid #aaa"></div>✨ また行きたい</div>
</div>

<div id="hint">地域をクリックするとパネルが開きます</div>

<div id="breadcrumb">
  <button id="back-btn">← 日本全体に戻る</button>
  <span id="breadcrumb-text">日本全体</span>
  <span id="loading">読み込み中...</span>
</div>

<div id="map-container">
  <svg id="japan-map" width="700" height="720"></svg>
</div>

<!-- パネルオーバーレイ -->
<div id="panel-overlay"></div>

<!-- コントロールパネル -->
<div id="panel">
  <div id="panel-title">東京都</div>
  <button id="panel-close">×</button>

  <div class="panel-section">
    <div class="panel-label">訪問状態</div>
    <div id="panel-levels">
      <button class="level-btn" data-level="none">未訪問</button>
      <button class="level-btn" data-level="visited">訪れた</button>
      <button class="level-btn" data-level="stayed">泊まった</button>
      <button class="level-btn" data-level="lived">住んだ</button>
    </div>
  </div>

  <div class="panel-section" id="panel-count-section">
    <div class="panel-label">訪問回数</div>
    <div id="panel-count-row">
      <button class="count-btn" id="count-minus">－</button>
      <span id="panel-count-val">0</span>
      <span id="panel-count-label">回</span>
      <button class="count-btn" id="count-plus">＋</button>
    </div>
  </div>

  <div class="panel-section">
    <button id="panel-return-btn">✨ また行きたい</button>
  </div>

  <div class="panel-section">
    <button id="panel-drill-btn">🏘 市区町村を見る →</button>
  </div>
</div>

<div id="tooltip"></div>
<button id="reset-btn">全リセット</button>

<script>
  const LEVELS = ['none', 'visited', 'stayed', 'lived'];
  const BASE_HSL = {
    visited: { h: 90,  s: 35, l: 78 },  // 1回目: 薄い黄緑
    stayed:  { h: 195, s: 40, l: 80 },  // 1回目: 薄い水色
    lived:   { h: 340, s: 45, l: 82 },  // 1回目: 薄いピンク
  };
  const COLORS = { none: '#e8eaf0' };
  const LABELS = { none: '未訪問', visited: '訪れた', stayed: '泊まった', lived: '住んだ' };

  function colorForLevel(level, count) {
    if (level === 'none' || !level) return COLORS.none;
    const base = BASE_HSL[level];
    if (!base) return '#888';
    const c = Math.min(count || 1, 10);
    const l = Math.max(base.l - (c - 1) * 6, 22);
    const s = Math.min(base.s + (c - 1) * 7, 95);
    return `hsl(${base.h},${s}%,${l}%)`;
  }

  let visitPref = JSON.parse(localStorage.getItem('visitPref2') || '{}');
  let visitCity = JSON.parse(localStorage.getItem('visitCity2') || '{}');
  let wantReturn = JSON.parse(localStorage.getItem('wantReturn') || '{}');

  function save() {
    localStorage.setItem('visitPref2', JSON.stringify(visitPref));
    localStorage.setItem('visitCity2', JSON.stringify(visitCity));
    localStorage.setItem('wantReturn', JSON.stringify(wantReturn));
  }

  function getLevel(data) { return (data && data.level) ? data.level : 'none'; }
  function getCount(data) { return (data && data.count) ? data.count : 0; }

  function updateCounter() {
    const all = Object.assign({}, visitPref, visitCity);
    let lived = 0, stayed = 0, visited = 0;
    Object.values(all).forEach(v => {
      const lv = getLevel(v);
      if (lv === 'lived')   lived++;
      if (lv === 'stayed')  stayed++;
      if (lv === 'visited') visited++;
    });
    const returnCount = Object.keys(wantReturn).length;
    document.getElementById('c-lived').textContent   = lived;
    document.getElementById('c-stayed').textContent  = stayed;
    document.getElementById('c-visited').textContent = visited;
    document.getElementById('c-return').textContent  = returnCount;
    document.getElementById('c-total').textContent   = lived + stayed + visited;
  }

  const tooltip   = document.getElementById('tooltip');
  const backBtn   = document.getElementById('back-btn');
  const loading   = document.getElementById('loading');
  const breadText = document.getElementById('breadcrumb-text');
  const svg       = d3.select('#japan-map');
  const W = 700, H = 720;
  let currentMode = 'pref';
  let prefFeatures = [];

  const projection = d3.geoMercator()
    .center([137, 35.5])
    .scale(1400)
    .translate([W / 2, H / 2]);

  const path = d3.geoPath().projection(projection);
  const g = svg.append('g');
  const sparkleGroup = svg.append('g').attr('id', 'sparkle-layer');

  // ---- スパークル ----
  function addSparkles(id, feature) {
    removeSparkles(id);
    const centroid = path.centroid(feature);
    if (isNaN(centroid[0])) return;
    const emojis = ['✨', '⭐', '✦', '★'];
    for (let i = 0; i < 5; i++) {
      const angle = (i / 5) * 2 * Math.PI;
      const r = 10 + Math.random() * 12;
      sparkleGroup.append('text')
        .attr('class', 'sparkle')
        .attr('data-id', id)
        .attr('x', centroid[0] + Math.cos(angle) * r)
        .attr('y', centroid[1] + Math.sin(angle) * r)
        .attr('text-anchor', 'middle')
        .style('animation-delay', (Math.random() * 1.5) + 's')
        .style('animation-duration', (1 + Math.random()) + 's')
        .style('font-size', (8 + Math.random() * 6) + 'px')
        .text(emojis[Math.floor(Math.random() * emojis.length)]);
    }
  }

  function removeSparkles(id) {
    sparkleGroup.selectAll(`[data-id="${id}"]`).remove();
  }

  // ---- ツールチップ ----
  function showTooltip(e, name, data) {
    const lv = getLevel(data);
    const cnt = getCount(data);
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX + 14) + 'px';
    tooltip.style.top  = (e.clientY - 34) + 'px';
    const countStr = lv !== 'none' ? `（${cnt}回）` : '';
    tooltip.textContent = name + '：' + LABELS[lv] + countStr;
  }

  function hideTooltip() { tooltip.style.display = 'none'; }

  // ---- パネル ----
  const panel        = document.getElementById('panel');
  const panelOverlay = document.getElementById('panel-overlay');
  const panelTitle   = document.getElementById('panel-title');
  const panelClose   = document.getElementById('panel-close');
  const panelCountVal = document.getElementById('panel-count-val');
  const countMinus   = document.getElementById('count-minus');
  const countPlus    = document.getElementById('count-plus');
  const panelReturnBtn = document.getElementById('panel-return-btn');
  const panelDrillBtn  = document.getElementById('panel-drill-btn');
  const panelCountSection = document.getElementById('panel-count-section');

  let panelState = { id: null, name: '', isCity: false, feature: null };

  function openPanel(id, name, isCity, feature) {
    panelState = { id, name, isCity, feature };
    panelTitle.textContent = name;

    const store = isCity ? visitCity : visitPref;
    const data  = store[id] || { level: 'none', count: 0 };
    const lv    = getLevel(data);
    const cnt   = getCount(data);

    // レベルボタン
    document.querySelectorAll('.level-btn').forEach(btn => {
      btn.className = 'level-btn';
      if (btn.dataset.level === lv) btn.classList.add('active-' + lv);
    });

    // カウント
    panelCountVal.textContent = cnt;
    countMinus.disabled = (cnt <= 0 || lv === 'none');
    panelCountSection.style.opacity = lv === 'none' ? '0.4' : '1';

    // また行きたい
    panelReturnBtn.classList.toggle('active', !!wantReturn[id]);

    // 市区町村ボタン（都道府県ビューのみ）
    panelDrillBtn.style.display = isCity ? 'none' : 'block';

    panelOverlay.classList.add('visible');
    panel.classList.add('visible');
  }

  function closePanel() {
    panel.classList.remove('visible');
    panelOverlay.classList.remove('visible');
    // 選択状態を解除
    g.selectAll('.prefecture, .city').classed('selected', false);
    panelState.id = null;
  }

  function refreshPanelCount() {
    if (!panelState.id) return;
    const store = panelState.isCity ? visitCity : visitPref;
    const data  = store[panelState.id] || { level: 'none', count: 0 };
    panelCountVal.textContent = getCount(data);
    countMinus.disabled = (getCount(data) <= 0 || getLevel(data) === 'none');
    panelCountSection.style.opacity = getLevel(data) === 'none' ? '0.4' : '1';
  }

  function syncMapColor(id, isCity) {
    const store = isCity ? visitCity : visitPref;
    const data  = store[id];
    const color = colorForLevel(getLevel(data), getCount(data));
    const sel   = isCity ? '.city' : '.prefecture';
    g.selectAll(sel).filter(d => (isCity ? getCityId(d, '') : getPrefId(d)) === id)
      .each(function(d) {
        const actualId = isCity ? getCityId(d, '') : getPrefId(d);
        if (actualId === id) d3.select(this).attr('fill', color);
      });
    // 直接 attr で確実に色を更新
    d3.selectAll(sel).each(function(d) {
      let did;
      if (isCity) {
        // cityIdは prefId が必要だが、パネル内では id に city ID を保存している
        did = d.properties.N03_007 || d.properties.code || d.properties.id || '';
        if (String(did) === id) d3.select(this).attr('fill', color);
      } else {
        did = getPrefId(d);
        if (did === id) d3.select(this).attr('fill', color);
      }
    });
  }

  // レベルボタン クリック
  document.querySelectorAll('.level-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const newLv = btn.dataset.level;
      const store = panelState.isCity ? visitCity : visitPref;
      const cur   = store[panelState.id] || { level: 'none', count: 0 };

      if (newLv === 'none') {
        delete store[panelState.id];
      } else {
        store[panelState.id] = { level: newLv, count: Math.max(1, getCount(cur)) };
      }

      // ボタン状態更新
      document.querySelectorAll('.level-btn').forEach(b => {
        b.className = 'level-btn';
        if (b.dataset.level === newLv) b.classList.add('active-' + newLv);
      });
      refreshPanelCount();

      // SVGの色を更新
      const data  = store[panelState.id];
      const color = colorForLevel(getLevel(data), getCount(data));
      g.selectAll(panelState.isCity ? '.city' : '.prefecture')
        .filter(d => {
          const did = panelState.isCity
            ? (d.properties.N03_007 || d.properties.code || d.properties.id || '')
            : getPrefId(d);
          return String(did) === panelState.id;
        })
        .attr('fill', color);

      save(); updateCounter();
    });
  });

  // カウント増減
  countPlus.addEventListener('click', () => {
    const store = panelState.isCity ? visitCity : visitPref;
    const cur   = store[panelState.id];
    if (!cur || getLevel(cur) === 'none') return;
    store[panelState.id].count = getCount(cur) + 1;
    refreshPanelCount();

    const color = colorForLevel(cur.level, cur.count);
    g.selectAll(panelState.isCity ? '.city' : '.prefecture')
      .filter(d => {
        const did = panelState.isCity
          ? (d.properties.N03_007 || d.properties.code || d.properties.id || '')
          : getPrefId(d);
        return String(did) === panelState.id;
      })
      .attr('fill', color);

    save(); updateCounter();
  });

  countMinus.addEventListener('click', () => {
    const store = panelState.isCity ? visitCity : visitPref;
    const cur   = store[panelState.id];
    if (!cur || getCount(cur) <= 1) return;
    store[panelState.id].count = getCount(cur) - 1;
    refreshPanelCount();

    const color = colorForLevel(cur.level, cur.count);
    g.selectAll(panelState.isCity ? '.city' : '.prefecture')
      .filter(d => {
        const did = panelState.isCity
          ? (d.properties.N03_007 || d.properties.code || d.properties.id || '')
          : getPrefId(d);
        return String(did) === panelState.id;
      })
      .attr('fill', color);

    save(); updateCounter();
  });

  // また行きたい
  panelReturnBtn.addEventListener('click', () => {
    const id = panelState.id;
    if (wantReturn[id]) {
      delete wantReturn[id];
      removeSparkles(id);
      panelReturnBtn.classList.remove('active');
    } else {
      wantReturn[id] = true;
      if (panelState.feature) addSparkles(id, panelState.feature);
      panelReturnBtn.classList.add('active');
    }
    save(); updateCounter();
  });

  // 市区町村ボタン
  panelDrillBtn.addEventListener('click', () => {
    const feature = panelState.feature;
    closePanel();
    if (feature) drillDown(feature);
  });

  // 閉じる
  panelClose.addEventListener('click', closePanel);
  panelOverlay.addEventListener('click', closePanel);

  // ---- 都道府県ビュー ----
  function getPrefId(d) { return String(d.properties.id || d.id || ''); }
  function getPrefName(d) { return d.properties.nam_ja || d.properties.name || getPrefId(d); }

  function renderPrefectures() {
    currentMode = 'pref';
    backBtn.style.display = 'none';
    breadText.textContent = '日本全体';
    document.getElementById('hint').textContent = '地域をクリックするとパネルが開きます';

    g.transition().duration(500).attr('transform', '');
    g.selectAll('*').remove();

    g.selectAll('path')
      .data(prefFeatures)
      .enter()
      .append('path')
      .attr('class', 'prefecture')
      .attr('d', path)
      .attr('fill', d => {
        const v = visitPref[getPrefId(d)];
        return colorForLevel(getLevel(v), getCount(v));
      })
      .on('mousemove', (e, d) => {
        showTooltip(e, getPrefName(d), visitPref[getPrefId(d)]);
      })
      .on('mouseleave', hideTooltip)
      .on('click', (e, d) => {
        hideTooltip();
        g.selectAll('.prefecture').classed('selected', false);
        d3.select(e.currentTarget).classed('selected', true);
        openPanel(getPrefId(d), getPrefName(d), false, d);
      });

    prefFeatures.forEach(d => {
      if (wantReturn[getPrefId(d)]) addSparkles(getPrefId(d), d);
    });
  }

  // ---- 市区町村ドリルダウン ----
  function drillDown(prefFeature) {
    const prefId   = getPrefId(prefFeature);
    const prefName = getPrefName(prefFeature);
    const code     = String(prefId).padStart(2, '0');

    loading.style.display = 'inline';
    breadText.textContent = prefName;
    backBtn.style.display = 'inline-block';
    document.getElementById('hint').textContent = '市区町村をクリックするとパネルが開きます';

    const bounds = path.bounds(prefFeature);
    const bw = bounds[1][0] - bounds[0][0];
    const bh = bounds[1][1] - bounds[0][1];
    const scale = Math.min(10, 0.85 / Math.max(bw / W, bh / H));
    const tx = W / 2 - scale * (bounds[0][0] + bw / 2);
    const ty = H / 2 - scale * (bounds[0][1] + bh / 2);

    g.transition().duration(600)
      .attr('transform', `translate(${tx},${ty}) scale(${scale})`);

    fetch(`https://api.github.com/repos/niiyz/JapanCityGeoJson/contents/geojson/${code}`)
      .then(r => { if (!r.ok) throw new Error('API error'); return r.json(); })
      .then(files => {
        const urls = files.map(f => f.download_url);
        return Promise.all(urls.map(url => fetch(url).then(r => r.json())));
      })
      .then(dataList => {
        loading.style.display = 'none';
        currentMode = 'city';

        const allFeatures = dataList.flatMap(d => d.features || []);

        g.selectAll('.prefecture').attr('opacity', 0.25).style('pointer-events', 'none');
        g.selectAll('.city').remove();

        g.selectAll('.city')
          .data(allFeatures)
          .enter()
          .append('path')
          .attr('class', 'city')
          .attr('d', path)
          .attr('fill', d => {
            const v = visitCity[getCityId(d, prefId)];
            return colorForLevel(getLevel(v), getCount(v));
          })
          .on('mousemove', (e, d) => {
            showTooltip(e, getCityName(d), visitCity[getCityId(d, prefId)]);
          })
          .on('mouseleave', hideTooltip)
          .on('click', (e, d) => {
            hideTooltip();
            g.selectAll('.city').classed('selected', false);
            d3.select(e.currentTarget).classed('selected', true);
            openPanel(getCityId(d, prefId), getCityName(d), true, d);
          });
      })
      .catch(err => {
        loading.style.display = 'none';
        breadText.textContent = prefName + '（データ取得失敗）';
        console.error(err);
      });
  }

  function getCityId(d, prefId) {
    return String(d.properties.N03_007 || d.properties.code || d.properties.id || prefId + '_' + (d.properties.N03_004 || d.properties.name || ''));
  }

  function getCityName(d) {
    return d.properties.N03_004 || d.properties.nam_ja || d.properties.name || '不明';
  }

  // 戻るボタン
  backBtn.addEventListener('click', () => {
    closePanel();
    g.selectAll('.city').remove();
    renderPrefectures();
  });

  // リセット
  document.getElementById('reset-btn').addEventListener('click', () => {
    if (!confirm('全データをリセットしますか？')) return;
    visitPref = {}; visitCity = {}; wantReturn = {};
    save();
    g.selectAll('.prefecture').attr('fill', COLORS['none']);
    g.selectAll('.city').attr('fill', COLORS['none']);
    sparkleGroup.selectAll('*').remove();
    closePanel();
    updateCounter();
  });

  // 初期ロード
  fetch('https://raw.githubusercontent.com/dataofjapan/land/master/japan.topojson')
    .then(r => r.json())
    .then(japan => {
      prefFeatures = topojson.feature(japan, japan.objects.japan).features;
      renderPrefectures();
      updateCounter();
    });
</script>

</body>
</html>
