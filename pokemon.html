<!DOCTYPE html>
<html lang="ja">
<head>
  <title>ポケモンガチャ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100vh;
      background-color: #80c840;
      font-family: 'Press Start 2P', monospace;
      image-rendering: pixelated;
      overflow-x: hidden;
    }

    /* タイル状の草地背景 */
    body {
      background-image:
        /* 草タイルのドット模様 */
        repeating-linear-gradient(0deg,   transparent 0px, transparent 15px, rgba(0,0,0,0.06) 15px, rgba(0,0,0,0.06) 16px),
        repeating-linear-gradient(90deg,  transparent 0px, transparent 15px, rgba(0,0,0,0.06) 15px, rgba(0,0,0,0.06) 16px);
      background-size: 16px 16px;
    }

    /* 上下の木のボーダー */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 32px;
      background: repeating-linear-gradient(90deg, #186820 0px, #186820 14px, #2c8c2c 14px, #2c8c2c 16px);
      border-bottom: 4px solid #0c4010;
      z-index: 100;
      image-rendering: pixelated;
    }

    /* コンテンツ */
    #content {
      position: relative;
      z-index: 1;
      padding-top: 48px;
      padding-bottom: 48px;
    }

    /* タイトルウィンドウ */
    .pixel-window {
      background: #f8f8d0;
      border: 4px solid #181818;
      box-shadow: 4px 4px 0 #181818;
      padding: 16px 20px;
      margin: 0 auto 24px;
      max-width: 480px;
      image-rendering: pixelated;
    }

    .pixel-window h1 {
      font-size: 0.85em;
      color: #181818;
      text-align: center;
      line-height: 1.8;
    }

    /* マシンエリア */
    #machine-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 24px;
    }

    /* ガチャマシン本体（ドット絵風） */
    #machine {
      position: relative;
      width: 320px;
      height: 360px;
      user-select: none;
    }

    .machine-dome {
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 210px;
      height: 160px;
      background: #a8d8f0;
      border-radius: 50% 50% 40% 40%;
      border: 4px solid #181818;
      box-shadow: 4px 4px 0 #181818;
      overflow: hidden;
    }

    .dome-inside {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-end;
      padding: 4px;
      gap: 4px;
    }

    .dome-ball {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 3px solid rgba(0,0,0,0.3);
      box-shadow: inset -4px -4px 6px rgba(0,0,0,0.2), inset 3px 3px 5px rgba(255,255,255,0.5);
    }

    .machine-body {
      position: absolute;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 260px;
      height: 220px;
      background: #e82020;
      border: 4px solid #181818;
      box-shadow: 4px 4px 0 #181818;
      border-radius: 0 0 8px 8px;
    }

    /* つまみ */
    #knob-wrapper {
      position: absolute;
      bottom: 36px; left: 50%;
      transform: translateX(-50%);
      cursor: grab;
    }

    #knob-wrapper:active { cursor: grabbing; }

    #knob {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: #f8c800;
      border: 4px solid #181818;
      box-shadow: 4px 4px 0 #181818;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #knob::after {
      content: '';
      position: absolute;
      top: 10px; left: 50%;
      transform: translateX(-50%);
      width: 8px;
      height: 20px;
      background: #181818;
      border-radius: 2px;
    }

    #progress-ring {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    /* ヒントウィンドウ */
    #hint-window {
      background: #f8f8d0;
      border: 4px solid #181818;
      box-shadow: 4px 4px 0 #181818;
      padding: 12px 16px;
      margin-top: 12px;
      font-size: 0.55em;
      color: #181818;
      text-align: center;
      line-height: 2;
      min-width: 260px;
    }

    /* 結果ウィンドウ */
    #result-area {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      max-width: 600px;
      margin: 0 auto;
      padding: 0 16px 48px;
      min-height: 200px;
    }

    @keyframes pop-in {
      0%   { opacity: 0; transform: scale(0.2); }
      60%  { transform: scale(1.15); }
      100% { opacity: 1; transform: scale(1); }
    }

    .pokemon-card {
      background: #f8f8d0;
      border: 4px solid #181818;
      box-shadow: 4px 4px 0 #181818;
      padding: 12px 10px 10px;
      text-align: center;
      width: 148px;
      cursor: pointer;
      opacity: 0;
      position: relative;
    }

    .pokemon-card.show {
      animation: pop-in 0.4s steps(8) forwards;
    }

    .pokemon-card:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 #181818;
    }

    .pokemon-card img {
      width: 80px;
      height: 80px;
      image-rendering: pixelated;
    }

    .pokemon-card .number {
      font-size: 0.45em;
      color: #606060;
      margin-bottom: 4px;
    }

    .pokemon-card .name {
      font-size: 0.55em;
      color: #181818;
      margin: 4px 0 6px;
      line-height: 1.6;
    }

    .types {
      display: flex;
      justify-content: center;
      gap: 4px;
      flex-wrap: wrap;
    }

    .type-badge {
      font-size: 0.4em;
      padding: 2px 6px;
      border: 2px solid #181818;
      color: #181818;
      background: #d0d0d0;
      font-family: 'Press Start 2P', monospace;
    }

    /* タイプ色 */
    .type-normal   { background: #c8c880; }
    .type-fire     { background: #f8a040; }
    .type-water    { background: #88a8f8; }
    .type-electric { background: #f8e040; }
    .type-grass    { background: #80c840; }
    .type-ice      { background: #98d8d8; }
    .type-fighting { background: #e05828; }
    .type-poison   { background: #c040c0; color: white; }
    .type-ground   { background: #d8b858; }
    .type-flying   { background: #a890f0; }
    .type-psychic  { background: #f870a0; }
    .type-bug      { background: #a8b820; }
    .type-rock     { background: #b8a038; }
    .type-ghost    { background: #705898; color: white; }
    .type-dragon   { background: #7038f8; color: white; }
    .type-dark     { background: #705848; color: white; }
    .type-steel    { background: #b8b8d0; }
    .type-fairy    { background: #f8b8d8; }
  </style>
</head>
<body>

<div id="content">

  <div class="pixel-window">
    <h1>★ POKEMON GACHA ★</h1>
  </div>

  <div id="machine-area">
    <div id="machine">
      <div class="machine-dome">
        <div class="dome-inside" id="dome-balls"></div>
      </div>
      <div class="machine-body"></div>
      <div id="knob-wrapper">
        <svg id="progress-ring" width="120" height="120">
          <circle cx="60" cy="60" r="52" fill="none" stroke="#606060" stroke-width="5"/>
          <circle id="ring-fill" cx="60" cy="60" r="52" fill="none"
            stroke="#f8c800" stroke-width="5"
            stroke-dasharray="327"
            stroke-dashoffset="327"
            stroke-linecap="butt"
            transform="rotate(-90 60 60)"/>
        </svg>
        <div id="knob"></div>
      </div>
    </div>

    <div id="hint-window">つまみをぐるっと回してね！</div>
  </div>

  <div id="result-area"></div>

</div>

<script>
  // ドームのボールをランダムに生成
  const ballColors = ['#e82020', '#f8c800', '#3888f8', '#38c038', '#c840c8', '#f87020', '#f850a0'];
  const domeBalls = document.getElementById('dome-balls');
  for (let i = 0; i < 10; i++) {
    let ball = document.createElement('div');
    ball.className = 'dome-ball';
    ball.style.background = ballColors[Math.floor(Math.random() * ballColors.length)];
    domeBalls.appendChild(ball);
  }

  const typeNames = {
    normal: 'ノーマル', fire: 'ほのお', water: 'みず', electric: 'でんき',
    grass: 'くさ', ice: 'こおり', fighting: 'かくとう', poison: 'どく',
    ground: 'じめん', flying: 'ひこう', psychic: 'エスパー', bug: 'むし',
    rock: 'いわ', ghost: 'ゴースト', dragon: 'ドラゴン', dark: 'あく',
    steel: 'はがね', fairy: 'フェアリー'
  };

  const knob = document.getElementById('knob');
  const knobWrapper = document.getElementById('knob-wrapper');
  const ringFill = document.getElementById('ring-fill');
  const hint = document.getElementById('hint-window');
  const CIRCUMFERENCE = 327;
  const REQUIRED_DEG = 360;

  let isDragging = false;
  let totalDeg = 0;
  let lastAngle = null;
  let fired = false;

  function getAngle(e, el) {
    const rect = el.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return Math.atan2(clientY - cy, clientX - cx) * (180 / Math.PI);
  }

  function onStart(e) {
    if (fired) return;
    isDragging = true;
    lastAngle = getAngle(e, knob);
    e.preventDefault();
  }

  function onMove(e) {
    if (!isDragging || fired) return;
    e.preventDefault();
    const angle = getAngle(e, knob);
    let delta = angle - lastAngle;
    if (delta > 180) delta -= 360;
    if (delta < -180) delta += 360;
    if (delta > 0) totalDeg += delta;
    lastAngle = angle;

    knob.style.transform = `rotate(${totalDeg}deg)`;
    const progress = Math.min(totalDeg / REQUIRED_DEG, 1);
    ringFill.style.strokeDashoffset = CIRCUMFERENCE * (1 - progress);

    if (progress < 0.5)     hint.textContent = 'もっと回して！';
    else if (progress < 1)  hint.textContent = 'あと少し！';

    if (totalDeg >= REQUIRED_DEG && !fired) {
      fired = true;
      isDragging = false;
      hint.textContent = '★ GACHA! ★';
      spinGacha();
    }
  }

  function onEnd() { isDragging = false; }

  knobWrapper.addEventListener('mousedown', onStart);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onEnd);
  knobWrapper.addEventListener('touchstart', onStart, { passive: false });
  window.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('touchend', onEnd);

  function fetchPokemon(number) {
    return Promise.all([
      fetch(`https://pokeapi.co/api/v2/pokemon/${number}`).then(r => r.json()),
      fetch(`https://pokeapi.co/api/v2/pokemon-species/${number}`).then(r => r.json())
    ]).then(function([data, speciesData]) {
      let jaName = speciesData.names.find(n => n.language.name === 'ja');
      return {
        number: number,
        name: jaName ? jaName.name : data.name,
        image: data.sprites.front_default,
        types: data.types.map(t => t.type.name),
        cry: data.cries && data.cries.latest ? data.cries.latest : null
      };
    });
  }

  function createCard(pokemon, delay) {
    let card = document.createElement('div');
    card.className = 'pokemon-card';

    let typeBadges = pokemon.types.map(function(type) {
      let label = typeNames[type] || type;
      return `<span class="type-badge type-${type}">${label}</span>`;
    }).join('');

    card.innerHTML = `
      <div class="number">No.${String(pokemon.number).padStart(3, '0')}</div>
      <img src="${pokemon.image}" alt="${pokemon.name}">
      <div class="name">${pokemon.name}</div>
      <div class="types">${typeBadges}</div>
    `;
    card.addEventListener('click', function() {
      if (pokemon.cry) new Audio(pokemon.cry).play();
    });
    setTimeout(function() { card.classList.add('show'); }, delay);
    return card;
  }

  function spinGacha() {
    const result = document.getElementById('result-area');
    result.innerHTML = '';

    let numbers = [];
    while (numbers.length < 3) {
      let n = Math.floor(Math.random() * 898) + 1;
      if (!numbers.includes(n)) numbers.push(n);
    }

    Promise.all(numbers.map(fetchPokemon)).then(function(pokemons) {
      pokemons.forEach(function(pokemon, i) {
        result.appendChild(createCard(pokemon, i * 500));
      });
      setTimeout(function() {
        totalDeg = 0;
        fired = false;
        knob.style.transform = 'rotate(0deg)';
        ringFill.style.strokeDashoffset = CIRCUMFERENCE;
        hint.textContent = 'もう一回！つまみを回してね';
      }, 2500);
    });
  }
</script>

</body>
</html>
