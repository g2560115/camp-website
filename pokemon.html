<!DOCTYPE html>
<html lang="ja">
<head>
  <title>赤色のポケモン図鑑</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <style>
    h1 {
      text-align: center;
    }

    #controls {
      text-align: center;
      margin-bottom: 24px;
    }

    #pokedex {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
    }

    .pokemon-card {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      background: #f9f9f9;
    }

    .pokemon-card img {
      width: 96px;
      height: 96px;
    }

    .pokemon-card .number {
      font-size: 0.8em;
      color: #888;
    }

    .pokemon-card .name {
      font-weight: bold;
      font-size: 1em;
      margin: 4px 0;
    }

    .types {
      display: flex;
      justify-content: center;
      gap: 4px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .type-badge {
      font-size: 0.75em;
      padding: 2px 8px;
      border-radius: 999px;
      color: white;
      font-weight: bold;
    }
    .type-normal   { background: #A8A878; }
    .type-fire     { background: #F08030; }
    .type-water    { background: #6890F0; }
    .type-electric { background: #F8D030; color: #333; }
    .type-grass    { background: #78C850; }
    .type-ice      { background: #98D8D8; color: #333; }
    .type-fighting { background: #C03028; }
    .type-poison   { background: #A040A0; }
    .type-ground   { background: #E0C068; color: #333; }
    .type-flying   { background: #A890F0; }
    .type-psychic  { background: #F85888; }
    .type-bug      { background: #A8B820; }
    .type-rock     { background: #B8A038; }
    .type-ghost    { background: #705898; }
    .type-dragon   { background: #7038F8; }
    .type-dark     { background: #705848; }
    .type-steel    { background: #B8B8D0; color: #333; }
    .type-fairy    { background: #EE99AC; color: #333; }
  </style>
</head>
<body>

<main class="container">
  <h1>赤色のポケモン図鑑</h1>

  <div id="controls">
    <p id="status">読み込み中...</p>
  </div>

  <div id="pokedex"></div>
</main>

<script>
  const typeNames = {
    normal: 'ノーマル', fire: 'ほのお', water: 'みず', electric: 'でんき',
    grass: 'くさ', ice: 'こおり', fighting: 'かくとう', poison: 'どく',
    ground: 'じめん', flying: 'ひこう', psychic: 'エスパー', bug: 'むし',
    rock: 'いわ', ghost: 'ゴースト', dragon: 'ドラゴン', dark: 'あく',
    steel: 'はがね', fairy: 'フェアリー'
  };

  function fetchPokemon(number) {
    return Promise.all([
      fetch(`https://pokeapi.co/api/v2/pokemon/${number}`).then(r => r.json()),
      fetch(`https://pokeapi.co/api/v2/pokemon-species/${number}`).then(r => r.json())
    ]).then(function([data, speciesData]) {
      let jaName = speciesData.names.find(n => n.language.name === 'ja');
      return {
        number: number,
        name: jaName ? jaName.name : data.name,
        image: data.sprites.front_default,
        types: data.types.map(t => t.type.name)
      };
    });
  }

  function createCard(pokemon) {
    let card = document.createElement('div');
    card.className = 'pokemon-card';

    let typeBadges = pokemon.types.map(function(type) {
      let label = typeNames[type] || type;
      return `<span class="type-badge type-${type}">${label}</span>`;
    }).join('');

    card.innerHTML = `
      <div class="number">No.${String(pokemon.number).padStart(3, '0')}</div>
      <img src="${pokemon.image}" alt="${pokemon.name}">
      <div class="name">${pokemon.name}</div>
      <div class="types">${typeBadges}</div>
    `;
    return card;
  }

  function loadRedPokedex() {
    let pokedex = document.getElementById('pokedex');
    let status = document.getElementById('status');

    fetch('https://pokeapi.co/api/v2/pokemon-color/red')
      .then(r => r.json())
      .then(function(colorData) {
        let species = colorData.pokemon_species;
        status.textContent = `赤色のポケモン: ${species.length}匹`;

        let numbers = species.map(function(s) {
          let parts = s.url.split('/').filter(p => p);
          return parseInt(parts[parts.length - 1]);
        }).filter(n => n <= 898).sort((a, b) => a - b);

        numbers.forEach(function(number) {
          fetchPokemon(number).then(function(pokemon) {
            pokedex.appendChild(createCard(pokemon));
          });
        });
      });
  }

  loadRedPokedex();
</script>

</body>
</html>
